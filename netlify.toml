[build]
  command = "npm run build"
  publish = "dist/music-playlist/browser"

[build.environment]
  NODE_VERSION = "20"

# Proxy iTunes API (same-origin) — evita fallos de JSONP/CORS en Safari móvil
[[redirects]]
  from = "/api/itunes/*"
  to = "https://itunes.apple.com/:splat"
  status = 200
  force = true

# SPA: permite refrescar rutas como /app/playlists, /app/search o /app/playlist/:id
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
