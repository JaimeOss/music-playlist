<button type="button" class="playlist-card group" (click)="onCardClick()">
  <div class="playlist-card__cover">
    <app-playlist-cover [songs]="playlist.songs" [alt]="playlist.name" [hoverScale]="true" />
  </div>

  <div class="playlist-card__header">
    <h3 class="playlist-card__title">{{ playlist.name }}</h3>
    @if (playback.playlistId() === playlist.id && playback.isPlaying()) {
      <span class="playlist-card__badge">Escuchando ahora</span>
    }
  </div>

  <p class="playlist-card__meta">{{ playlistMetaLabel }}</p>
</button>
