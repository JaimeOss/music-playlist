<button
  type="button"
  class="playlist-card group"
  [class.playlist-card--locked]="playlist.locked"
  [attr.aria-label]="playlist.name"
  (click)="onCardClick()"
>
  <div class="playlist-card__cover">
    @if (playlist.locked) {
      <span class="playlist-card__lock pi pi-lock" aria-hidden="true"></span>
    }

    <app-playlist-cover [songs]="playlist.songs" [alt]="playlist.name" [hoverScale]="true" />

    <div class="playlist-card__overlay">
      <h3 class="playlist-card__title">{{ playlist.name }}</h3>
      @if (playback.playlistId() === playlist.id && playback.isPlaying()) {
        <span class="playlist-card__badge">Reproduciendo</span>
      }
    </div>
  </div>
</button>
