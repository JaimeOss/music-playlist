<div class="playlist-cover" [class.playlist-cover--hover-scale]="hoverScale">
  @if (covers.length === 0) {
    <img [src]="defaultCover" [alt]="alt" class="playlist-cover__image" />
  } @else if (covers.length === 1) {
    <img [src]="covers[0]" [alt]="alt" class="playlist-cover__image" />
  } @else if (covers.length === 2) {
    <div class="playlist-cover__grid playlist-cover__grid--cols-2">
      @for (cover of covers; track cover) {
        <img [src]="cover" [alt]="alt" class="playlist-cover__image" />
      }
    </div>
  } @else if (covers.length === 3) {
    <div class="playlist-cover__grid playlist-cover__grid--2x2">
      <img [src]="covers[0]" [alt]="alt" class="playlist-cover__image playlist-cover__image--span-rows" />
      <img [src]="covers[1]" [alt]="alt" class="playlist-cover__image" />
      <img [src]="covers[2]" [alt]="alt" class="playlist-cover__image" />
    </div>
  } @else {
    <div class="playlist-cover__grid playlist-cover__grid--2x2">
      @for (cover of covers; track cover) {
        <img [src]="cover" [alt]="alt" class="playlist-cover__image" />
      }
    </div>
  }
</div>
