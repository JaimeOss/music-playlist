@if (song) {
  <div
    class="fixed inset-x-0 bottom-0 z-20 border-t border-zinc-800 bg-zinc-950/95 px-4 py-3 backdrop-blur"
  >
    <div class="mx-auto flex max-w-6xl items-center gap-4">
      <img
        [src]="song.cover"
        [alt]="song.title"
        class="h-12 w-12 shrink-0 rounded-md bg-zinc-800 object-cover"
      />

      <div class="min-w-0 flex-1">
        <div class="mb-1 flex items-center gap-2">
          <p class="truncate text-sm font-medium text-white">{{ song.title }}</p>
          <span class="shrink-0 rounded-full bg-blue-600/20 px-2 py-0.5 text-[10px] font-medium text-blue-400">
            Preview · 30s
          </span>
        </div>
        <p class="truncate text-xs text-zinc-400">{{ song.artist }}</p>

        <div class="mt-2 flex items-center gap-2">
          <span class="w-8 text-[10px] text-zinc-500">{{ currentTimeLabel }}</span>
          <div class="h-1 flex-1 overflow-hidden rounded-full bg-zinc-800">
            <div
              class="h-full rounded-full bg-blue-500"
              [style.width.%]="progressPercent"
            ></div>
          </div>
          <span class="w-8 text-right text-[10px] text-zinc-500">0:30</span>
        </div>
      </div>

      <p-button
        type="button"
        [icon]="playIcon"
        [rounded]="true"
        styleClass="player-btn"
        ariaLabel="Play o pausa"
        (onClick)="toggle()"
      />
    </div>
  </div>
}
