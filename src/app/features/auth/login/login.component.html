<div class="login-page" [class.login-page--busy]="showLoadingScreen">  <aside class="login-hero" aria-hidden="true">
    <img src="/images/cover.png" alt="" class="login-hero__image" />
    <div class="login-hero__overlay"></div>
  </aside>

  <main class="login-main">
    <div class="login-panel">
      <h1 class="login-panel__title">Inicio de sesión</h1>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
        @if (authError) {
          <p-message severity="error" text="Correo o contraseña incorrectos" styleClass="w-full" />
        }

        <div class="login-field">
          <label for="email" class="login-field__label">Correo</label>
          <input
            pInputText
            id="email"
            type="email"
            formControlName="email"
            placeholder="usuario@musicapp.com"
            autocomplete="email"
            class="login-input w-full"
            [invalid]="isInvalid('email')"
          />
          @if (getEmailError(); as error) {
            <p class="login-field__error">{{ error }}</p>
          }
        </div>

        <div class="login-field">
          <label for="password" class="login-field__label">Contraseña</label>
          <div class="login-password">
            <input
              pInputText
              id="password"
              [type]="passwordVisible ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••"
              autocomplete="current-password"
              class="login-input login-password__input w-full"
              [invalid]="isInvalid('password')"
            />
            <button
              type="button"
              class="login-password__toggle"
              [attr.aria-label]="passwordVisible ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              [attr.aria-pressed]="passwordVisible"
              (click)="togglePasswordVisibility()"
            >
              <i [class]="passwordVisible ? 'pi pi-eye-slash' : 'pi pi-eye'" aria-hidden="true"></i>
            </button>
          </div>
          @if (getPasswordError(); as error) {
            <p class="login-field__error">{{ error }}</p>
          }
        </div>

        <p-button
          type="submit"
          label="Iniciar sesión"
          styleClass="login-submit w-full"
          [disabled]="form.invalid || showLoadingScreen"
        />
      </form>

      <div class="login-demo">
        <p class="login-demo__title">Credenciales de prueba</p>
        <p class="login-demo__line">
          <span class="login-demo__label">Correo:</span> usuario@musicapp.com
        </p>
        <p class="login-demo__line">
          <span class="login-demo__label">Contraseña:</span> 123456
        </p>
      </div>
    </div>
  </main>
</div>

@if (showLoadingScreen) {
  <app-login-loading-screen (finished)="onLoadingFinished()" />
}
