<div [class.pb-28]="playback.hasActivePlayback()">
  <router-outlet />
</div>

<app-audio-player
  [song]="playback.currentSong()"
  [playlistName]="playback.playlistName()"
  [hasPrevious]="playback.hasPreviousSong()"
  [hasNext]="playback.hasNextSong()"
  [shuffleEnabled]="playback.isShuffleEnabled()"
  [loopEnabled]="playback.isLoopEnabled()"
  (playingChange)="playback.onPlayingChange($event)"
  (previousClick)="playback.playPrevious()"
  (nextClick)="playback.playNext()"
  (previewEnded)="playback.onPreviewEnded()"
  (shuffleToggle)="playback.toggleShuffle()"
  (loopToggle)="playback.toggleLoop()"
/>
